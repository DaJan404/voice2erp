[project]
name = "voice2erp"
version = "0.1.0"
description = "Voice-first Business Central sales assistant"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/js-stubs"]